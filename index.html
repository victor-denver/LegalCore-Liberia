<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LegalCore West Africa — ECOWAS-wide legal intelligence: 12 states, 3 traditions, 590+ laws. Search primary law instantly." />
    <meta name="theme-color" content="#0A2E22" />
    <title>LegalCore West Africa — ECOWAS Legal Intelligence Platform</title>
    <!-- Resolve the theme before first paint so there is no flash of the wrong one. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('legalcore-theme');
          if (saved === 'light' || saved === 'dark') t = saved;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch (e) { /* private mode — fall back to dark */ }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
