<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LegalCore Liberia — Search Liberian statutes, court cases, and legal opinions instantly." />
    <meta name="theme-color" content="#0E0E0E" />
    <title>LegalCore — Liberia's Legal Intelligence Platform</title>
    <script>
      (function(){ try{ var t=localStorage.getItem('legalcore-theme'); if(!t) t='dark'; document.documentElement.setAttribute('data-theme', t); }catch(e){ document.documentElement.setAttribute('data-theme','dark'); } })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
